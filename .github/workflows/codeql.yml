name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript, actions
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        id: analyze
        with:
          # Code scanning uploads need a public repository or GitHub Advanced
          # Security. While the repository is private, analyze without
          # uploading and fail on any finding instead.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif
      - name: Fail on findings (private repository)
        if: github.event.repository.private
        run: |
          count=$(jq '[.runs[].results[]] | length' sarif/*.sarif | awk '{s+=$1} END {print s+0}')
          echo "CodeQL findings: $count"
          jq -r '.runs[].results[] | "\(.ruleId): \(.message.text) at \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' sarif/*.sarif
          test "$count" -eq 0
